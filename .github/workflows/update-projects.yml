name: Update project cards

on:
  schedule:
    - cron: '17 11 * * *'   # daily, ~7 AM New York
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Commit only when the data changed (ignoring the timestamp line).
      - run: |
          if git diff --quiet -I '"generated"' -- data/projects.json; then
            echo "No project changes."
            exit 0
          fi
          git config user.name "site-updater"
          git config user.email "site-updater@users.noreply.github.com"
          git add data/projects.json
          git commit -m "Update project cards"
          git push
